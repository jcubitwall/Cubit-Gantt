<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Cubit Project Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5f2ea;
    --board:#ffffff;
    --ink:#1b2b3a;
    --ink-soft:#3d4f60;
    --muted:#7a8a96;
    --faint:#a3aeb6;
    --line:#d7dbd9;
    --line-strong:#b9c2c2;
    --cubit-orange:#d9772e;
    --cubit-orange-deep:#b85a1c;
    --danger:#b8452f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background: var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    padding: 28px 4vw 60px;
    -webkit-font-smoothing:antialiased;
    background-image:
      linear-gradient(var(--paper), var(--paper)),
      repeating-linear-gradient(0deg, rgba(27,43,58,0.025) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, rgba(27,43,58,0.025) 0 1px, transparent 1px 28px);
  }
  .toolbar{
    max-width:1300px;
    margin: 0 auto 16px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  .titleblock input{
    background:none;
    border:none;
    color:var(--ink);
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:clamp(24px,3.6vw,36px);
    padding:2px 4px;
    border-radius:4px;
    outline:none;
    width: min(72vw, 560px);
  }
  .titleblock input:focus{ background: rgba(27,43,58,0.05); }
  .actions{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  button.act{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:.03em;
    font-weight:500;
    background: var(--board);
    color:var(--ink);
    border:1.5px solid var(--line-strong);
    padding:9px 14px;
    border-radius:6px;
    cursor:pointer;
    transition: background .15s, border-color .15s;
  }
  button.act:hover{ background:#f0f0ec; border-color:var(--ink-soft); }
  button.act.primary{
    background: var(--cubit-orange);
    color:#fff;
    border-color: var(--cubit-orange-deep);
    font-weight:600;
  }
  button.act.primary:hover{ background: var(--cubit-orange-deep); }

  .undoredo{
    display:flex;
    border:1.5px solid var(--line-strong);
    border-radius:6px;
    overflow:hidden;
    background:var(--board);
  }
  .undoredo button{
    background:none;
    border:none;
    padding:8px 13px;
    font-size:16px;
    color:var(--ink);
    cursor:pointer;
  }
  .undoredo button:first-child{ border-right:1px solid var(--line-strong); }
  .undoredo button:hover:not(:disabled){ background:#f0f0ec; }
  .undoredo button:disabled{ color:var(--faint); opacity:.4; cursor:default; }

  .zoomctl{
    display:flex;
    align-items:center;
    gap:2px;
    background: var(--board);
    border:1.5px solid var(--line-strong);
    border-radius:6px;
    overflow:hidden;
  }
  .zoomctl button{
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    font-weight:600;
    background:none;
    border:none;
    color:var(--ink);
    padding:8px 12px;
    cursor:pointer;
  }
  .zoomctl button:hover{ background:#f0f0ec; }
  .zoomctl .pct{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--muted);
    padding:0 4px;
    min-width:42px;
    text-align:center;
  }
  .zoomctl .divider{ width:1px; align-self:stretch; background:var(--line-strong); }

  .printbar{
    max-width:1300px;
    margin: 0 auto 14px;
    display:flex;
    flex-wrap:wrap;
    gap:22px;
    align-items:center;
  }
  .printbar-group{ display:flex; align-items:center; gap:8px; }
  .printbar-label{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .toggle2{
    display:flex;
    border:1.5px solid var(--line-strong);
    border-radius:6px;
    overflow:hidden;
  }
  .toggle-btn{
    background:var(--board);
    border:none;
    padding:6px 12px;
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--ink);
    cursor:pointer;
  }
  .toggle-btn.active{ background:var(--cubit-orange); color:#fff; }
  .stepper{
    display:flex;
    align-items:center;
    border:1.5px solid var(--line-strong);
    border-radius:6px;
    overflow:hidden;
  }
  .stepper button{
    background:var(--board);
    border:none;
    padding:6px 11px;
    font-family:'JetBrains Mono', monospace;
    font-weight:600;
    font-size:13px;
    color:var(--ink);
    cursor:pointer;
  }
  .stepper button:hover{ background:#f0f0ec; }
  .stepper span{
    min-width:20px;
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--ink);
  }

  .canvas-wrap{
    max-width:1300px;
    margin:0 auto;
    background: var(--board);
    border:1.5px solid var(--line-strong);
    border-radius:4px;
    padding:2px;
    box-shadow: 0 1px 3px rgba(27,43,58,0.06);
    overflow:auto;
    touch-action: none;
  }
  .canvas-viewport{
    position:relative;
  }
  .canvas{
    position:absolute;
    top:0; left:0;
    transform-origin:0 0;
    border-radius:3px;
    background-color:#fdfcfa;
    background-image:
      radial-gradient(rgba(27,43,58,0.09) 1px, transparent 1px),
      linear-gradient(rgba(217,119,46,0.4) 0 2px, transparent 2px 100%),
      linear-gradient(90deg, rgba(217,119,46,0.4) 0 2px, transparent 2px 100%);
    background-repeat: repeat, repeat-y, repeat-x;
  }

  .note{
    position:absolute;
    border-radius:7px;
    display:flex;
    flex-direction:column;
    cursor:grab;
    user-select:none;
    touch-action:none;
    box-shadow: 0 2px 5px rgba(27,43,58,0.16);
    overflow:hidden;
    border:1px solid rgba(27,43,58,0.14);
    border-left-width:6px;
  }
  .note:active{ cursor:grabbing; }
  .note-top{
    display:flex;
    align-items:center;
    gap:8px;
    padding: 7px 8px 3px;
    flex:none;
  }
  .swatch{
    width:13px; height:13px;
    border-radius:50%;
    background: rgba(255,255,255,0.55);
    border:1.5px solid rgba(27,43,58,0.35);
    flex:none;
    cursor:pointer;
  }
  .note-del{
    margin-left:auto;
    width:18px; height:18px;
    border-radius:50%;
    background: rgba(27,43,58,0.08);
    color: rgba(27,43,58,0.55);
    font-size:10px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex:none;
  }
  .note-del:hover{ background:var(--danger); color:#fff; }
  .note-text{
    flex:1;
    outline:none;
    padding: 2px 12px 12px;
    font-family:'Inter', sans-serif;
    font-size:13.5px;
    font-weight:500;
    line-height:1.42;
    color: var(--ink);
    overflow:auto;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .note-text:empty::before{
    content:"Task — lead — aid(s)...";
    color: rgba(27,43,58,0.38);
    font-weight:400;
  }
  .note-text:focus{ background: rgba(255,255,255,0.5); }

  .note-c1{ background:#dcebf6; border-left-color:#3f6f96; }
  .note-c2{ background:#f7e9c9; border-left-color:#b8862c; }
  .note-c3{ background:#d6ece2; border-left-color:#397a63; }
  .note-c4{ background:#f4dbcd; border-left-color:#b3542f; }
  .note-c5{ background:#e5dcf0; border-left-color:#7255a3; }
  .note-c6{ background:#e2ecd0; border-left-color:#63813a; }

  .handle{
    position:absolute;
    touch-action:none;
    z-index:2;
  }
  .handle.e{ top:0; right:-3px; bottom:0; width:12px; cursor:ew-resize; }
  .handle.s{ left:0; right:0; bottom:-3px; height:12px; cursor:ns-resize; }
  .handle.se{ right:-3px; bottom:-3px; width:16px; height:16px; cursor:nwse-resize; }
  .handle.se::after{
    content:"";
    position:absolute; right:3px; bottom:3px;
    width:8px; height:8px;
    border-right:2px solid rgba(27,43,58,0.4);
    border-bottom:2px solid rgba(27,43,58,0.4);
  }

  .print-canvas{ display:none; }

  @media print{
    body{ background:#fff; padding:0; background-image:none; }
    .toolbar, .printbar, .canvas-wrap{ display:none !important; }
    .print-canvas{ display:block !important; background:#fff; }
    .print-page{
      position:relative;
      background:#fff;
      overflow:hidden;
    }
    .print-note{
      position:absolute;
      border-radius:6px;
      border:1px solid rgba(27,43,58,0.3);
      border-left-width:5px;
      overflow:hidden;
      break-inside:avoid;
      page-break-inside:avoid;
    }
    .print-note-text{
      width:100%;
      height:100%;
      padding:6px 9px;
      font-family:'Inter', sans-serif;
      color:#1b2b3a;
      line-height:1.32;
      white-space:pre-wrap;
      word-break:break-word;
      overflow:visible;
    }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="titleblock">
    <input id="title" value="Cubit Project Flow" />
  </div>
  <div class="actions">
    <div class="undoredo">
      <button id="undoBtn" onclick="undo()" title="Undo">↶</button>
      <button id="redoBtn" onclick="redo()" title="Redo">↷</button>
    </div>
    <div class="zoomctl">
      <span class="printbar-label" style="padding-left:8px;">Page</span>
      <button onclick="zoomBy(-0.1)">−</button>
      <span class="pct" id="zoomPct">100%</span>
      <button onclick="zoomBy(0.1)">+</button>
      <div class="divider"></div>
      <button onclick="zoomReset()" style="font-size:11px;">Reset</button>
    </div>
    <div class="zoomctl">
      <span class="printbar-label" style="padding-left:8px;">Blocks</span>
      <button onclick="boxZoomBy(-0.1)">−</button>
      <span class="pct" id="boxZoomPct">100%</span>
      <button onclick="boxZoomBy(0.1)">+</button>
      <div class="divider"></div>
      <button onclick="boxZoomReset()" style="font-size:11px;">Reset</button>
    </div>
    <button class="act" onclick="addNote()">+ add note</button>
    <button class="act" onclick="resetData()">Clear board</button>
    <button class="act primary" onclick="doPrint()">Export / Print PDF</button>
  </div>
</div>

<div class="printbar">
  <div class="printbar-group">
    <span class="printbar-label">Orientation</span>
    <div class="toggle2">
      <button id="ori-landscape" class="toggle-btn active" onclick="setOrientation('landscape')">Landscape</button>
      <button id="ori-portrait" class="toggle-btn" onclick="setOrientation('portrait')">Portrait</button>
    </div>
  </div>
  <div class="printbar-group">
    <span class="printbar-label">Pages across</span>
    <div class="stepper">
      <button onclick="changePages('x',-1)">−</button>
      <span id="pagesXVal">1</span>
      <button onclick="changePages('x',1)">+</button>
    </div>
  </div>
  <div class="printbar-group">
    <span class="printbar-label">Pages down</span>
    <div class="stepper">
      <button onclick="changePages('y',-1)">−</button>
      <span id="pagesYVal">1</span>
      <button onclick="changePages('y',1)">+</button>
    </div>
  </div>
</div>

<div class="canvas-wrap" id="canvasWrap">
  <div class="canvas-viewport" id="canvasViewport">
    <div class="canvas" id="canvas"></div>
  </div>
</div>

<div class="print-canvas" id="printCanvas"></div>

<script>
const STORE_KEY = 'gantt-chart-data-v4';
const ZOOM_KEY = 'gantt-chart-zoom-v1';
const BOXZOOM_KEY = 'gantt-chart-boxzoom-v1';
const PALETTE = ['c1','c2','c3','c4','c5','c6'];
const MIN_W = 90;
const MIN_H = 56;
const ZOOM_MIN = 0.2;
const ZOOM_MAX = 3;
const BOXZOOM_MIN = 0.3;
const BOXZOOM_MAX = 2.2;

// Fixed physical page math: canvas is always an exact multiple of one
// Tabloid page's printable area, at 96 CSS px per inch. What you see is
// what prints -- no runtime content-fitting or scaling.
const DPI = 96;
const MARGIN_IN = 0.4;
const TABLOID_LONG_IN = 17;
const TABLOID_SHORT_IN = 11;

const DEFAULT_DATA = {
  title: "Cubit Project Flow",
  notes: []
};

let data = null;
let zoom = 1;
let noteScale = 1;
let printOrientation = 'landscape';
let pagesX = 1;
let pagesY = 1;
let history = [];
let historyIndex = -1;
const MAX_HISTORY = 60;

function tileSizePx(){
  const pageWIn = printOrientation === 'landscape' ? TABLOID_LONG_IN : TABLOID_SHORT_IN;
  const pageHIn = printOrientation === 'landscape' ? TABLOID_SHORT_IN : TABLOID_LONG_IN;
  const tileW = (pageWIn - MARGIN_IN*2) * DPI;
  const tileH = (pageHIn - MARGIN_IN*2) * DPI;
  return { pageWIn, pageHIn, tileW, tileH };
}

async function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    data = raw ? JSON.parse(raw) : structuredClone(DEFAULT_DATA);
  }catch(e){
    data = structuredClone(DEFAULT_DATA);
  }
  try{
    const z = localStorage.getItem(ZOOM_KEY);
    if(z) zoom = parseFloat(z) || 1;
    const bz = localStorage.getItem(BOXZOOM_KEY);
    if(bz) noteScale = parseFloat(bz) || 1;
  }catch(e){}
  render();
  pushHistory();
}

async function saveData(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }catch(e){}
}
function saveZoom(){
  try{ localStorage.setItem(ZOOM_KEY, String(zoom)); }catch(e){}
}
function saveBoxZoom(){
  try{ localStorage.setItem(BOXZOOM_KEY, String(noteScale)); }catch(e){}
}

function pushHistory(){
  const snap = JSON.stringify(data);
  if(history[historyIndex] === snap) return;
  history = history.slice(0, historyIndex+1);
  history.push(snap);
  if(history.length > MAX_HISTORY) history.shift();
  historyIndex = history.length - 1;
  updateUndoRedoButtons();
}
function commit(){
  saveData();
  pushHistory();
}
function undo(){
  if(historyIndex <= 0) return;
  historyIndex--;
  data = JSON.parse(history[historyIndex]);
  render();
  saveData();
  updateUndoRedoButtons();
}
function redo(){
  if(historyIndex >= history.length-1) return;
  historyIndex++;
  data = JSON.parse(history[historyIndex]);
  render();
  saveData();
  updateUndoRedoButtons();
}
function updateUndoRedoButtons(){
  const u = document.getElementById('undoBtn');
  const r = document.getElementById('redoBtn');
  if(u) u.disabled = historyIndex <= 0;
  if(r) r.disabled = historyIndex >= history.length-1;
}

function resetData(){
  if(!confirm("Clear the board? This removes every note.")) return;
  data = structuredClone(DEFAULT_DATA);
  render();
  commit();
}

function zoomBy(delta){
  zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, +(zoom + delta).toFixed(2)));
  applyZoom();
  saveZoom();
}
function zoomReset(){
  zoom = 1;
  applyZoom();
  saveZoom();
}
function boxZoomBy(delta){
  noteScale = Math.max(BOXZOOM_MIN, Math.min(BOXZOOM_MAX, +(noteScale + delta).toFixed(2)));
  render();
  saveBoxZoom();
}
function boxZoomReset(){
  noteScale = 1;
  render();
  saveBoxZoom();
}

function setOrientation(o){
  printOrientation = o;
  document.getElementById('ori-landscape').classList.toggle('active', o === 'landscape');
  document.getElementById('ori-portrait').classList.toggle('active', o === 'portrait');
  render();
}
function changePages(axis, delta){
  if(axis === 'x'){
    pagesX = Math.max(1, Math.min(8, pagesX + delta));
    document.getElementById('pagesXVal').textContent = pagesX;
  } else {
    pagesY = Math.max(1, Math.min(8, pagesY + delta));
    document.getElementById('pagesYVal').textContent = pagesY;
  }
  render();
}

function applyZoom(){
  const canvas = document.getElementById('canvas');
  const viewport = document.getElementById('canvasViewport');
  const { tileW, tileH } = tileSizePx();
  const canvasW = tileW * pagesX;
  const canvasH = tileH * pagesY;
  canvas.style.transform = `scale(${zoom})`;
  viewport.style.width = (canvasW * zoom) + 'px';
  viewport.style.height = (canvasH * zoom) + 'px';
  document.getElementById('zoomPct').textContent = Math.round(zoom*100) + '%';
  document.getElementById('boxZoomPct').textContent = Math.round(noteScale*100) + '%';
}

// pinch-to-zoom (two-finger touch) -- board/page zoom only
(function(){
  const wrap = document.getElementById('canvasWrap');
  let pinchStartDist = null;
  let pinchStartZoom = 1;
  wrap.addEventListener('touchstart', (e)=>{
    if(e.touches.length === 2){
      pinchStartDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      pinchStartZoom = zoom;
    }
  }, {passive:true});
  wrap.addEventListener('touchmove', (e)=>{
    if(e.touches.length === 2 && pinchStartDist){
      const dist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, pinchStartZoom * (dist/pinchStartDist)));
      applyZoom();
      e.preventDefault();
    }
  }, {passive:false});
  wrap.addEventListener('touchend', (e)=>{
    if(e.touches.length < 2){ pinchStartDist = null; saveZoom(); }
  }, {passive:true});
})();

// Manual panning for empty canvas background -- native scroll is fully
// disabled (touch-action:none) so there is no race with note dragging.
(function(){
  const wrap = document.getElementById('canvasWrap');
  const canvas = document.getElementById('canvas');
  let panning = false;
  let startX=0, startY=0, startScrollLeft=0, startScrollTop=0;

  function onDown(e){
    if(e.target !== canvas) return; // only pan when the touch starts on empty board, not a note
    panning = true;
    startX = e.clientX; startY = e.clientY;
    startScrollLeft = wrap.scrollLeft; startScrollTop = wrap.scrollTop;
    e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId);
    window.addEventListener('pointermove', onMove, {passive:false});
    window.addEventListener('pointerup', onUp);
  }
  function onMove(e){
    if(!panning) return;
    e.preventDefault();
    wrap.scrollLeft = startScrollLeft - (e.clientX - startX);
    wrap.scrollTop = startScrollTop - (e.clientY - startY);
  }
  function onUp(){
    panning = false;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  }
  canvas.addEventListener('pointerdown', onDown, {passive:false});
})();

function addNote(){
  const n = data.notes.length;
  const x = 20 + (n % 5) * 40;
  const y = 20 + Math.floor(n / 5) * 30;
  data.notes.push({ text:"", x, y, w:220, h:100, color: PALETTE[n % PALETTE.length] });
  render();
  commit();
}

function removeNote(i){
  data.notes.splice(i,1);
  render();
  commit();
}

function clampNotesToCanvas(canvasW, canvasH){
  data.notes.forEach(n=>{
    const ew = n.w * noteScale;
    const eh = n.h * noteScale;
    n.x = Math.max(0, Math.min(n.x, Math.max(0, canvasW - ew)));
    n.y = Math.max(0, Math.min(n.y, Math.max(0, canvasH - eh)));
  });
}

function render(){
  document.getElementById('title').value = data.title;
  const canvas = document.getElementById('canvas');
  canvas.innerHTML = '';

  const { tileW, tileH } = tileSizePx();
  const canvasW = tileW * pagesX;
  const canvasH = tileH * pagesY;

  clampNotesToCanvas(canvasW, canvasH);

  canvas.style.width = canvasW + 'px';
  canvas.style.height = canvasH + 'px';
  canvas.style.backgroundSize = '22px 22px, ' + tileW + 'px ' + tileH + 'px, ' + tileW + 'px ' + tileH + 'px';

  data.notes.forEach((n, i)=>{
    drawNote(canvas, n, i, canvasW, canvasH);
  });

  applyZoom();
}

function drawNote(canvas, n, i, canvasW, canvasH){
  const el = document.createElement('div');
  el.className = 'note note-' + n.color;
  el.style.left = n.x + 'px';
  el.style.top = n.y + 'px';
  el.style.width = (n.w * noteScale) + 'px';
  el.style.height = (n.h * noteScale) + 'px';
  el.innerHTML = `
    <div class="note-top">
      <div class="swatch" data-role="swatch"></div>
      <div class="note-del" data-role="del">✕</div>
    </div>
    <div class="note-text" contenteditable="true" data-role="text" style="font-size:${(13.5*noteScale).toFixed(1)}px;">${escapeHtml(n.text)}</div>
    <div class="handle e" data-role="e"></div>
    <div class="handle s" data-role="s"></div>
    <div class="handle se" data-role="se"></div>
  `;
  canvas.appendChild(el);

  const textEl = el.querySelector('[data-role="text"]');
  const swatch = el.querySelector('[data-role="swatch"]');
  const delBtn = el.querySelector('[data-role="del"]');
  const he = el.querySelector('[data-role="e"]');
  const hs = el.querySelector('[data-role="s"]');
  const hse = el.querySelector('[data-role="se"]');

  textEl.addEventListener('blur', ()=>{
    n.text = textEl.innerText.replace(/\n+$/,'');
    commit();
  });
  swatch.addEventListener('click', (e)=>{
    e.stopPropagation();
    const idx = PALETTE.indexOf(n.color);
    n.color = PALETTE[(idx+1) % PALETTE.length];
    el.className = 'note note-' + n.color;
    commit();
  });
  delBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    removeNote(i);
  });

  attachDrag(el, n, textEl, swatch, delBtn, he, hs, hse, canvasW, canvasH);
}

function attachDrag(el, n, textEl, swatch, delBtn, he, hs, hse, canvasW, canvasH){
  let mode = null;
  let startX=0, startY=0, startNX=0, startNY=0, startW=0, startH=0;

  function isInteractive(t){
    return t === textEl || textEl.contains(t) || t === swatch || t === delBtn || t === he || t === hs || t === hse;
  }

  function onDown(e, m){
    mode = m;
    startX = e.clientX; startY = e.clientY;
    startNX = n.x; startNY = n.y; startW = n.w; startH = n.h;
    el.dataset.dragged = '0';
    e.preventDefault();
    e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId);
    window.addEventListener('pointermove', onMove, {passive:false});
    window.addEventListener('pointerup', onUp);
  }

  function onMove(e){
    e.preventDefault();

    const wrap = document.getElementById('canvasWrap');
    const wrapRect = wrap.getBoundingClientRect();
    const EDGE = 44, SPEED = 16;
    if(mode !== null){
      if(e.clientY > wrapRect.bottom - EDGE) wrap.scrollTop += SPEED;
      else if(e.clientY < wrapRect.top + EDGE) wrap.scrollTop = Math.max(0, wrap.scrollTop - SPEED);
      if(e.clientX > wrapRect.right - EDGE) wrap.scrollLeft += SPEED;
      else if(e.clientX < wrapRect.left + EDGE) wrap.scrollLeft = Math.max(0, wrap.scrollLeft - SPEED);
    }

    const rawDX = e.clientX - startX;
    const rawDY = e.clientY - startY;
    const dx = rawDX / zoom;
    const dy = rawDY / zoom;
    const dxN = rawDX / (zoom * noteScale);
    const dyN = rawDY / (zoom * noteScale);
    if(Math.abs(rawDX) > 1 || Math.abs(rawDY) > 1) el.dataset.dragged = '1';

    if(mode === 'move'){
      n.x = Math.max(0, Math.min(startNX + dx, Math.max(0, canvasW - n.w*noteScale)));
      n.y = Math.max(0, Math.min(startNY + dy, Math.max(0, canvasH - n.h*noteScale)));
    } else if(mode === 'e'){
      n.w = Math.max(MIN_W, Math.min(startW + dxN, (canvasW - n.x)/noteScale));
    } else if(mode === 's'){
      n.h = Math.max(MIN_H, Math.min(startH + dyN, (canvasH - n.y)/noteScale));
    } else if(mode === 'se'){
      n.w = Math.max(MIN_W, Math.min(startW + dxN, (canvasW - n.x)/noteScale));
      n.h = Math.max(MIN_H, Math.min(startH + dyN, (canvasH - n.y)/noteScale));
    }
    el.style.left = n.x + 'px';
    el.style.top = n.y + 'px';
    el.style.width = (n.w * noteScale) + 'px';
    el.style.height = (n.h * noteScale) + 'px';
  }

  function onUp(){
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    const dragged = el.dataset.dragged === '1';
    mode = null;
    if(dragged){
      commit();
      render();
    }
  }

  el.addEventListener('pointerdown', (e)=>{
    if(isInteractive(e.target)) return;
    onDown(e, 'move');
  }, {passive:false});
  he.addEventListener('pointerdown', (e)=>{ e.stopPropagation(); onDown(e, 'e'); }, {passive:false});
  hs.addEventListener('pointerdown', (e)=>{ e.stopPropagation(); onDown(e, 's'); }, {passive:false});
  hse.addEventListener('pointerdown', (e)=>{ e.stopPropagation(); onDown(e, 'se'); }, {passive:false});
}

document.getElementById('title').addEventListener('input', (e)=>{
  data.title = e.target.value;
  saveData();
});
document.getElementById('title').addEventListener('blur', ()=>{
  pushHistory();
});

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---- Print: exact 1:1 mapping of the fixed on-screen page(s). No scaling math. ----
function doPrint(){
  buildPrintSnapshot();
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      window.print();
    });
  });
}

function buildPrintSnapshot(){
  const printEl = document.getElementById('printCanvas');
  printEl.innerHTML = '';

  const { tileW: contentTileW, tileH: contentTileH } = tileSizePx();

  // The physical output page is always declared in the landscape dimension
  // order -- some WebKit versions render a custom @page declared in portrait
  // (narrow x tall) order as blank. Portrait content is rotated to fit into
  // a landscape physical page instead, which sidesteps that bug entirely.
  const physW = (TABLOID_LONG_IN - MARGIN_IN*2) * DPI;
  const physH = (TABLOID_SHORT_IN - MARGIN_IN*2) * DPI;

  let styleTag = document.getElementById('printPageSize');
  if(!styleTag){
    styleTag = document.createElement('style');
    styleTag.id = 'printPageSize';
    document.head.appendChild(styleTag);
  }
  styleTag.textContent = `@page{ size: ${TABLOID_LONG_IN}in ${TABLOID_SHORT_IN}in; margin: ${MARGIN_IN}in; }`;

  const totalPages = pagesX * pagesY;
  let pageIndex = 0;

  for(let py = 0; py < pagesY; py++){
    for(let px = 0; px < pagesX; px++){
      pageIndex++;
      const pageDiv = document.createElement('div');
      pageDiv.className = 'print-page';
      pageDiv.style.width = physW + 'px';
      pageDiv.style.height = physH + 'px';
      if(pageIndex < totalPages) pageDiv.style.pageBreakAfter = 'always';

      let host = pageDiv;
      if(printOrientation === 'portrait'){
        const rot = document.createElement('div');
        rot.style.position = 'absolute';
        rot.style.top = '50%';
        rot.style.left = '50%';
        rot.style.width = contentTileW + 'px';
        rot.style.height = contentTileH + 'px';
        rot.style.transformOrigin = 'center center';
        rot.style.transform = 'translate(-50%, -50%) rotate(90deg)';
        pageDiv.appendChild(rot);
        host = rot;
      }

      data.notes.forEach(n=>{
        const nx = n.x - (px * contentTileW);
        const ny = n.y - (py * contentTileH);
        const nw = n.w * noteScale;
        const nh = n.h * noteScale;
        // skip notes that don't intersect this content tile at all
        if(nx + nw <= 0 || nx >= contentTileW || ny + nh <= 0 || ny >= contentTileH) return;

        const d = document.createElement('div');
        d.className = 'print-note note-' + n.color;
        d.style.left = nx + 'px';
        d.style.top = ny + 'px';
        d.style.width = nw + 'px';
        d.style.height = nh + 'px';
        const fontPx = Math.max(7, 13.5 * noteScale);
        const t = document.createElement('div');
        t.className = 'print-note-text';
        t.style.fontSize = fontPx + 'px';
        t.textContent = n.text || '';
        d.appendChild(t);
        host.appendChild(d);
      });

      printEl.appendChild(pageDiv);
    }
  }
}

window.addEventListener('afterprint', ()=>{
  document.getElementById('printCanvas').innerHTML = '';
});

loadData();
</script>
