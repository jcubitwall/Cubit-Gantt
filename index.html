<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Cubit Project Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5f2ea;
    --board:#ffffff;
    --ink:#1b2b3a;
    --ink-soft:#3d4f60;
    --muted:#7a8a96;
    --faint:#a3aeb6;
    --line:#d7dbd9;
    --line-strong:#b9c2c2;
    --cubit-orange:#d9772e;
    --cubit-orange-deep:#b85a1c;
    --danger:#b8452f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background: var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    padding: 28px 4vw 60px;
    -webkit-font-smoothing:antialiased;
    background-image:
      linear-gradient(var(--paper), var(--paper)),
      repeating-linear-gradient(0deg, rgba(27,43,58,0.025) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, rgba(27,43,58,0.025) 0 1px, transparent 1px 28px);
  }
  .toolbar{
    max-width:1300px;
    margin: 0 auto 16px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  .titleblock input{
    background:none;
    border:none;
    color:var(--ink);
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:clamp(24px,3.6vw,36px);
    padding:2px 4px;
    border-radius:4px;
    outline:none;
    width: min(72vw, 560px);
  }
  .titleblock input:focus{ background: rgba(27,43,58,0.05); }
  .actions{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  button.act{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:.03em;
    font-weight:500;
    background: var(--board);
    color:var(--ink);
    border:1.5px solid var(--line-strong);
    padding:9px 14px;
    border-radius:6px;
    cursor:pointer;
    transition: background .15s, border-color .15s;
  }
  button.act:hover{ background:#f0f0ec; border-color:var(--ink-soft); }
  button.act.primary{
    background: var(--cubit-orange);
    color:#fff;
    border-color: var(--cubit-orange-deep);
    font-weight:600;
  }
  button.act.primary:hover{ background: var(--cubit-orange-deep); }

  .undoredo{
    display:flex;
    border:1.5px solid var(--line-strong);
    border-radius:6px;
    overflow:hidden;
    background:var(--board);
  }
  .undoredo button{
    background:none;
    border:none;
    padding:8px 13px;
    font-size:16px;
    color:var(--ink);
    cursor:pointer;
  }
  .undoredo button:first-child{ border-right:1px solid var(--line-strong); }
  .undoredo button:hover:not(:disabled){ background:#f0f0ec; }
  .undoredo button:disabled{ color:var(--faint); opacity:.4; cursor:default; }

  .zoomctl{
    display:flex;
    align-items:center;
    gap:2px;
    background: var(--board);
    border:1.5px solid var(--line-strong);
    border-radius:6px;
    overflow:hidden;
  }
  .zoomctl button{
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    font-weight:600;
    background:none;
    border:none;
    color:var(--ink);
    padding:8px 12px;
    cursor:pointer;
  }
  .zoomctl button:hover{ background:#f0f0ec; }
  .zoomctl .pct{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--muted);
    padding:0 4px;
    min-width:42px;
    text-align:center;
  }
  .zoomctl .divider{ width:1px; align-self:stretch; background:var(--line-strong); }

  .printbar{
    max-width:1300px;
    margin: 0 auto 14px;
    display:flex;
    flex-wrap:wrap;
    gap:22px;
    align-items:center;
  }
  .printbar-group{ display:flex; align-items:center; gap:8px; }
  .printbar-label{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .toggle2{
    display:flex;
    border:1.5px solid var(--line-strong);
    border-radius:6px;
    overflow:hidden;
  }
  .toggle-btn{
    background:var(--board);
    border:none;
    padding:6px 12px;
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--ink);
    cursor:pointer;
  }
  .toggle-btn.active{ background:var(--cubit-orange); color:#fff; }
  .stepper{
    display:flex;
    align-items:center;
    border:1.5px solid var(--line-strong);
    border-radius:6px;
    overflow:hidden;
  }
  .stepper button{
    background:var(--board);
    border:none;
    padding:6px 11px;
    font-family:'JetBrains Mono', monospace;
    font-weight:600;
    font-size:13px;
    color:var(--ink);
    cursor:pointer;
  }
  .stepper button:hover{ background:#f0f0ec; }
  .stepper span{
    min-width:20px;
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--ink);
  }

  .ruler{
    max-width:1300px;
    margin: 0 auto;
    height:14px;
    background-image: repeating-linear-gradient(90deg, var(--line-strong) 0 1px, transparent 1px 40px), repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 8px);
    background-position: 0 100%, 0 100%;
    background-size: 100% 10px, 100% 5px;
    background-repeat: no-repeat;
    opacity:.6;
  }

  .canvas-wrap{
    max-width:1300px;
    margin:0 auto;
    background: var(--board);
    border:1.5px solid var(--line-strong);
    border-radius:4px;
    padding:2px;
    box-shadow: 0 1px 3px rgba(27,43,58,0.06);
    overflow:auto;
    touch-action: pan-x pan-y;
  }
  .canvas-viewport{
    position:relative;
  }
  .canvas{
    position:absolute;
    top:0; left:0;
    transform-origin:0 0;
    min-height:760px;
    min-width:1260px;
    border-radius:3px;
    background-color:#fdfcfa;
    background-image: radial-gradient(rgba(27,43,58,0.09) 1px, transparent 1px);
    background-size: 22px 22px;
  }

  .note{
    position:absolute;
    border-radius:7px;
    display:flex;
    flex-direction:column;
    cursor:grab;
    user-select:none;
    touch-action:none;
    box-shadow: 0 2px 5px rgba(27,43,58,0.16);
    overflow:hidden;
    border:1px solid rgba(27,43,58,0.14);
    border-left-width:6px;
  }
  .note:active{ cursor:grabbing; }
  .note-top{
    display:flex;
    align-items:center;
    gap:8px;
    padding: 7px 8px 3px;
    flex:none;
  }
  .swatch{
    width:13px; height:13px;
    border-radius:50%;
    background: rgba(255,255,255,0.55);
    border:1.5px solid rgba(27,43,58,0.35);
    flex:none;
    cursor:pointer;
  }
  .note-del{
    margin-left:auto;
    width:18px; height:18px;
    border-radius:50%;
    background: rgba(27,43,58,0.08);
    color: rgba(27,43,58,0.55);
    font-size:10px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex:none;
  }
  .note-del:hover{ background:var(--danger); color:#fff; }
  .note-text{
    flex:1;
    outline:none;
    padding: 2px 12px 12px;
    font-family:'Inter', sans-serif;
    font-size:13.5px;
    font-weight:500;
    line-height:1.42;
    color: var(--ink);
    overflow:auto;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .note-text:empty::before{
    content:"Task — lead — aid(s)...";
    color: rgba(27,43,58,0.38);
    font-weight:400;
  }
  .note-text:focus{ background: rgba(255,255,255,0.5); }

  .note-c1{ background:#dcebf6; border-left-color:#3f6f96; }
  .note-c2{ background:#f7e9c9; border-left-color:#b8862c; }
  .note-c3{ background:#d6ece2; border-left-color:#397a63; }
  .note-c4{ background:#f4dbcd; border-left-color:#b3542f; }
  .note-c5{ background:#e5dcf0; border-left-color:#7255a3; }
  .note-c6{ background:#e2ecd0; border-left-color:#63813a; }

  .handle{
    position:absolute;
    touch-action:none;
    z-index:2;
  }
  .handle.e{ top:0; right:-3px; bottom:0; width:12px; cursor:ew-resize; }
  .handle.s{ left:0; right:0; bottom:-3px; height:12px; cursor:ns-resize; }
  .handle.se{ right:-3px; bottom:-3px; width:16px; height:16px; cursor:nwse-resize; }
  .handle.se::after{
    content:"";
    position:absolute; right:3px; bottom:3px;
    width:8px; height:8px;
    border-right:2px solid rgba(27,43,58,0.4);
    border-bottom:2px solid rgba(27,43,58,0.4);
  }

  .print-canvas{ display:none; }

  @media print{
    body{ background:#fff; padding:0; background-image:none; }
    .toolbar, .ruler, .canvas-wrap{ display:none !important; }
    .print-canvas{
      display:block !important;
      position:relative;
      background:#fff;
    }
    .print-page{
      position:relative;
      background:#fff;
    }
    .print-clip{
      position:relative;
      overflow:hidden;
    }
    .print-title{
      font-family:'Oswald', sans-serif;
      font-weight:600;
      font-size:16px;
      color:#1b2b3a;
      margin-bottom:6px;
    }
    .print-note{
      position:absolute;
      border-radius:6px;
      border:1px solid rgba(27,43,58,0.3);
      border-left-width:5px;
      overflow:hidden;
      break-inside:avoid;
      page-break-inside:avoid;
    }
    .print-note-text{
      width:100%;
      height:100%;
      padding:6px 9px;
      font-family:'Inter', sans-serif;
      color:#1b2b3a;
      line-height:1.32;
      white-space:pre-wrap;
      word-break:break-word;
      overflow:visible;
    }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="titleblock">
    <input id="title" value="Cubit Project Flow" />
  </div>
  <div class="actions">
    <div class="zoomctl">
      <span class="printbar-label" style="padding-left:8px;">Page</span>
      <button onclick="zoomBy(-0.1)">−</button>
      <span class="pct" id="zoomPct">100%</span>
      <button onclick="zoomBy(0.1)">+</button>
      <div class="divider"></div>
      <button onclick="zoomReset()" style="font-size:11px;">Reset</button>
    </div>
    <div class="zoomctl">
      <span class="printbar-label" style="padding-left:8px;">Blocks</span>
      <button onclick="boxZoomBy(-0.1)">−</button>
      <span class="pct" id="boxZoomPct">100%</span>
      <button onclick="boxZoomBy(0.1)">+</button>
      <div class="divider"></div>
      <button onclick="boxZoomReset()" style="font-size:11px;">Reset</button>
    </div>
    <div class="undoredo">
      <button id="undoBtn" onclick="undo()" title="Undo">↶</button>
      <button id="redoBtn" onclick="redo()" title="Redo">↷</button>
    </div>
    <button class="act" onclick="addNote()">+ add note</button>
    <button class="act" onclick="resetData()">Reset to sample</button>
    <button class="act primary" onclick="doPrint()">Export / Print PDF</button>
  </div>
</div>

<div class="printbar">
  <div class="printbar-group">
    <span class="printbar-label">Orientation</span>
    <div class="toggle2">
      <button id="ori-landscape" class="toggle-btn active" onclick="setOrientation('landscape')">Landscape</button>
      <button id="ori-portrait" class="toggle-btn" onclick="setOrientation('portrait')">Portrait</button>
    </div>
  </div>
  <div class="printbar-group">
    <span class="printbar-label">Pages across</span>
    <div class="stepper">
      <button onclick="changePages('x',-1)">−</button>
      <span id="pagesXVal">1</span>
      <button onclick="changePages('x',1)">+</button>
    </div>
  </div>
  <div class="printbar-group">
    <span class="printbar-label">Pages down</span>
    <div class="stepper">
      <button onclick="changePages('y',-1)">−</button>
      <span id="pagesYVal">1</span>
      <button onclick="changePages('y',1)">+</button>
    </div>
  </div>
</div>

<div class="ruler"></div>

<div class="canvas-wrap" id="canvasWrap">
  <div class="canvas-viewport" id="canvasViewport">
    <div class="canvas" id="canvas"></div>
  </div>
</div>

<div class="print-canvas" id="printCanvas"></div>

<script>
const STORE_KEY = 'gantt-chart-data-v3';
const ZOOM_KEY = 'gantt-chart-zoom-v1';
const BOXZOOM_KEY = 'gantt-chart-boxzoom-v1';
const PALETTE = ['c1','c2','c3','c4','c5','c6'];
const MIN_W = 90;
const MIN_H = 56;
const ZOOM_MIN = 0.2;
const ZOOM_MAX = 3;
const BOXZOOM_MIN = 0.3;
const BOXZOOM_MAX = 2.2;

const DEFAULT_DATA = {
  title: "Cubit Project Flow",
  notes: [
    { text:"Order shower / toilet / appliances\nLead: Johnny", x:20, y:20, w:230, h:90, color:"c1" },
    { text:"Permits & inspections booked\nLead: Sean", x:270, y:20, w:220, h:90, color:"c2" },
    { text:"Make SIPs (press buffer)\nLead: Joshua  Aid: Jaden, Jed", x:510, y:20, w:260, h:90, color:"c3" },
    { text:"Box construction / butyl / windows & doors\nLead: Joshua  Aid: Kian, Jed, Mark, Jaden", x:20, y:130, w:320, h:100, color:"c4" },
    { text:"Cut ceiling / window boxes / cabinet parts\nLead: Brad  Aid: Kian, Jaden, Mark", x:360, y:130, w:300, h:100, color:"c6" },
    { text:"Plumbing / electrical rough-in\nLead: Heinrich + electrician", x:20, y:250, w:260, h:90, color:"c5" },
    { text:"SIP roof / compression seal / butyl / gutter trims\nLead: Joshua", x:300, y:250, w:280, h:90, color:"c3" },
    { text:"Cabinetry / counters / plugs / transport / delivery\nLead: Brad + electrician", x:20, y:360, w:320, h:100, color:"c1" }
  ]
};

let data = null;
let zoom = 1;
let noteScale = 1;
let naturalW = 1260;
let naturalH = 760;
let printOrientation = 'landscape';
let pagesX = 1;
let pagesY = 1;
let history = [];
let historyIndex = -1;
const MAX_HISTORY = 60;

function setOrientation(o){
  printOrientation = o;
  document.getElementById('ori-landscape').classList.toggle('active', o === 'landscape');
  document.getElementById('ori-portrait').classList.toggle('active', o === 'portrait');
}
function changePages(axis, delta){
  if(axis === 'x'){
    pagesX = Math.max(1, Math.min(8, pagesX + delta));
    document.getElementById('pagesXVal').textContent = pagesX;
  } else {
    pagesY = Math.max(1, Math.min(8, pagesY + delta));
    document.getElementById('pagesYVal').textContent = pagesY;
  }
}

async function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    data = raw ? JSON.parse(raw) : structuredClone(DEFAULT_DATA);
  }catch(e){
    data = structuredClone(DEFAULT_DATA);
  }
  try{
    const z = localStorage.getItem(ZOOM_KEY);
    if(z) zoom = parseFloat(z) || 1;
    const bz = localStorage.getItem(BOXZOOM_KEY);
    if(bz) noteScale = parseFloat(bz) || 1;
  }catch(e){}
  render();
  pushHistory();
}

async function saveData(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }catch(e){}
}

function pushHistory(){
  const snap = JSON.stringify(data);
  if(history[historyIndex] === snap) return;
  history = history.slice(0, historyIndex+1);
  history.push(snap);
  if(history.length > MAX_HISTORY) history.shift();
  historyIndex = history.length - 1;
  updateUndoRedoButtons();
}

function commit(){
  saveData();
  pushHistory();
}

function undo(){
  if(historyIndex <= 0) return;
  historyIndex--;
  data = JSON.parse(history[historyIndex]);
  render();
  saveData();
  updateUndoRedoButtons();
}

function redo(){
  if(historyIndex >= history.length-1) return;
  historyIndex++;
  data = JSON.parse(history[historyIndex]);
  render();
  saveData();
  updateUndoRedoButtons();
}

function updateUndoRedoButtons(){
  const u = document.getElementById('undoBtn');
  const r = document.getElementById('redoBtn');
  if(u) u.disabled = historyIndex <= 0;
  if(r) r.disabled = historyIndex >= history.length-1;
}
function saveZoom(){
  try{ localStorage.setItem(ZOOM_KEY, String(zoom)); }catch(e){}
}
function saveBoxZoom(){
  try{ localStorage.setItem(BOXZOOM_KEY, String(noteScale)); }catch(e){}
}

function boxZoomBy(delta){
  noteScale = Math.max(BOXZOOM_MIN, Math.min(BOXZOOM_MAX, +(noteScale + delta).toFixed(2)));
  document.getElementById('boxZoomPct').textContent = Math.round(noteScale*100) + '%';
  render();
  saveBoxZoom();
}
function boxZoomReset(){
  noteScale = 1;
  document.getElementById('boxZoomPct').textContent = '100%';
  render();
  saveBoxZoom();
}

function resetData(){
  if(!confirm("Reset to the sample board? This clears your edits.")) return;
  data = structuredClone(DEFAULT_DATA);
  render();
  commit();
}

function zoomBy(delta){
  zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, +(zoom + delta).toFixed(2)));
  applyZoom();
  saveZoom();
}
function zoomReset(){
  zoom = 1;
  applyZoom();
  saveZoom();
}
function applyZoom(){
  const canvas = document.getElementById('canvas');
  const viewport = document.getElementById('canvasViewport');
  canvas.style.transform = `scale(${zoom})`;
  viewport.style.width = (naturalW * zoom) + 'px';
  viewport.style.height = (naturalH * zoom) + 'px';
  document.getElementById('zoomPct').textContent = Math.round(zoom*100) + '%';
  document.getElementById('boxZoomPct').textContent = Math.round(noteScale*100) + '%';
}

// pinch-to-zoom (two-finger touch)
(function(){
  const wrap = document.getElementById('canvasWrap');
  let pinchStartDist = null;
  let pinchStartZoom = 1;
  wrap.addEventListener('touchstart', (e)=>{
    if(e.touches.length === 2){
      pinchStartDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      pinchStartZoom = zoom;
    }
  }, {passive:true});
  wrap.addEventListener('touchmove', (e)=>{
    if(e.touches.length === 2 && pinchStartDist){
      const dist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, pinchStartZoom * (dist/pinchStartDist)));
      applyZoom();
      e.preventDefault();
    }
  }, {passive:false});
  wrap.addEventListener('touchend', (e)=>{
    if(e.touches.length < 2){ pinchStartDist = null; saveZoom(); }
  }, {passive:true});
})();

function addNote(){
  const n = data.notes.length;
  const x = 20 + (n % 5) * 40;
  const y = 20 + Math.floor(n / 5) * 30;
  data.notes.push({ text:"", x, y, w:220, h:100, color: PALETTE[n % PALETTE.length] });
  render();
  commit();
}

function removeNote(i){
  data.notes.splice(i,1);
  render();
  commit();
}

function render(){
  document.getElementById('title').value = data.title;
  const canvas = document.getElementById('canvas');
  canvas.innerHTML = '';
  let maxBottom = 760;
  let maxRight = 1260;
  data.notes.forEach((n, i)=>{
    drawNote(canvas, n, i);
    maxBottom = Math.max(maxBottom, n.y + n.h*noteScale + 40);
    maxRight = Math.max(maxRight, n.x + n.w*noteScale + 40);
  });
  naturalW = maxRight;
  naturalH = maxBottom;
  canvas.style.minHeight = naturalH + 'px';
  canvas.style.minWidth = naturalW + 'px';
  applyZoom();
}

function drawNote(canvas, n, i){
  const el = document.createElement('div');
  el.className = 'note note-' + n.color;
  el.style.left = n.x + 'px';
  el.style.top = n.y + 'px';
  el.style.width = (n.w * noteScale) + 'px';
  el.style.height = (n.h * noteScale) + 'px';
  el.innerHTML = `
    <div class="note-top">
      <div class="swatch" data-role="swatch"></div>
      <div class="note-del" data-role="del">✕</div>
    </div>
    <div class="note-text" contenteditable="true" data-role="text" style="font-size:${(13.5*noteScale).toFixed(1)}px;">${escapeHtml(n.text)}</div>
    <div class="handle e" data-role="e"></div>
    <div class="handle s" data-role="s"></div>
    <div class="handle se" data-role="se"></div>
  `;
  canvas.appendChild(el);

  const textEl = el.querySelector('[data-role="text"]');
  const swatch = el.querySelector('[data-role="swatch"]');
  const delBtn = el.querySelector('[data-role="del"]');
  const he = el.querySelector('[data-role="e"]');
  const hs = el.querySelector('[data-role="s"]');
  const hse = el.querySelector('[data-role="se"]');

  textEl.addEventListener('blur', ()=>{
    n.text = textEl.innerText.replace(/\n+$/,'');
    commit();
  });
  swatch.addEventListener('click', (e)=>{
    e.stopPropagation();
    const idx = PALETTE.indexOf(n.color);
    n.color = PALETTE[(idx+1) % PALETTE.length];
    el.className = 'note note-' + n.color;
    commit();
  });
  delBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    removeNote(i);
  });

  attachDrag(el, canvas, n, textEl, swatch, delBtn, he, hs, hse);
}

function attachDrag(el, canvas, n, textEl, swatch, delBtn, he, hs, hse){
  let mode = null;
  let startX=0, startY=0, startNX=0, startNY=0, startW=0, startH=0;

  function isInteractive(t){
    return t === textEl || textEl.contains(t) || t === swatch || t === delBtn || t === he || t === hs || t === hse;
  }

  function onDown(e, m){
    mode = m;
    startX = e.clientX; startY = e.clientY;
    startNX = n.x; startNY = n.y; startW = n.w; startH = n.h;
    el.dataset.dragged = '0';
    e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }

  function onMove(e){
    const rawDX = e.clientX - startX;
    const rawDY = e.clientY - startY;
    const dx = rawDX / zoom;
    const dy = rawDY / zoom;
    const dxN = rawDX / (zoom * noteScale);
    const dyN = rawDY / (zoom * noteScale);
    if(Math.abs(rawDX) > 1 || Math.abs(rawDY) > 1) el.dataset.dragged = '1';

    if(mode === 'move'){
      n.x = Math.max(0, Math.min(startNX + dx, Math.max(naturalW, startNX + n.w*noteScale) - n.w*noteScale));
      n.y = Math.max(0, startNY + dy);
    } else if(mode === 'e'){
      n.w = Math.max(MIN_W, startW + dxN);
    } else if(mode === 's'){
      n.h = Math.max(MIN_H, startH + dyN);
    } else if(mode === 'se'){
      n.w = Math.max(MIN_W, startW + dxN);
      n.h = Math.max(MIN_H, startH + dyN);
    }
    el.style.left = n.x + 'px';
    el.style.top = n.y + 'px';
    el.style.width = (n.w * noteScale) + 'px';
    el.style.height = (n.h * noteScale) + 'px';

    const neededBottom = n.y + n.h*noteScale + 40;
    const neededRight = n.x + n.w*noteScale + 40;
    if(neededBottom > naturalH || neededRight > naturalW){
      naturalH = Math.max(naturalH, neededBottom);
      naturalW = Math.max(naturalW, neededRight);
      canvas.style.minHeight = naturalH + 'px';
      canvas.style.minWidth = naturalW + 'px';
      applyZoom();
    }
  }

  function onUp(){
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    const dragged = el.dataset.dragged === '1';
    mode = null;
    if(dragged){
      commit();
      render();
    }
  }

  el.addEventListener('pointerdown', (e)=>{
    if(isInteractive(e.target)) return;
    onDown(e, 'move');
  });
  he.addEventListener('pointerdown', (e)=>{ e.stopPropagation(); onDown(e, 'e'); });
  hs.addEventListener('pointerdown', (e)=>{ e.stopPropagation(); onDown(e, 's'); });
  hse.addEventListener('pointerdown', (e)=>{ e.stopPropagation(); onDown(e, 'se'); });
}

document.getElementById('title').addEventListener('input', (e)=>{
  data.title = e.target.value;
  saveData();
});
document.getElementById('title').addEventListener('blur', ()=>{
  pushHistory();
});

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---- Print: always fit the actual content onto one Tabloid page ----
function doPrint(){
  buildPrintSnapshot();
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      window.print();
    });
  });
}

function buildPrintSnapshot(){
  const printEl = document.getElementById('printCanvas');
  printEl.innerHTML = '';

  if(!data.notes.length){
    return;
  }

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  data.notes.forEach(n=>{
    minX = Math.min(minX, n.x);
    minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + n.w*noteScale);
    maxY = Math.max(maxY, n.y + n.h*noteScale);
  });
  const contentW = Math.max(1, maxX - minX);
  const contentH = Math.max(1, maxY - minY);

  const DPI = 96;
  const MARGIN_IN = 0.4;
  const TITLE_IN = 0.35;
  const pageWIn = printOrientation === 'landscape' ? 17 : 11;
  const pageHIn = printOrientation === 'landscape' ? 11 : 17;

  const tileW = (pageWIn - MARGIN_IN*2) * DPI;
  const tileH = (pageHIn - MARGIN_IN*2) * DPI - (TITLE_IN * DPI);

  const totalAvailW = tileW * pagesX;
  const totalAvailH = tileH * pagesY;

  let scaleX = totalAvailW / contentW;
  let scaleY = totalAvailH / contentH;
  scaleX = Math.max(0.05, Math.min(scaleX, 8));
  scaleY = Math.max(0.05, Math.min(scaleY, 8));
  const fontScale = Math.min(scaleX, scaleY);

  let styleTag = document.getElementById('printPageSize');
  if(!styleTag){
    styleTag = document.createElement('style');
    styleTag.id = 'printPageSize';
    document.head.appendChild(styleTag);
  }
  styleTag.textContent = `@page{ size: ${pageWIn}in ${pageHIn}in; margin: ${MARGIN_IN}in; }`;

  const scaledW = contentW * scaleX;
  const scaledH = contentH * scaleY;
  const totalPages = pagesX * pagesY;
  let pageIndex = 0;

  for(let py = 0; py < pagesY; py++){
    for(let px = 0; px < pagesX; px++){
      pageIndex++;
      const pageDiv = document.createElement('div');
      pageDiv.className = 'print-page';
      pageDiv.style.width = tileW + 'px';
      pageDiv.style.height = (tileH + TITLE_IN*DPI) + 'px';
      if(pageIndex < totalPages) pageDiv.style.pageBreakAfter = 'always';

      const titleDiv = document.createElement('div');
      titleDiv.className = 'print-title';
      titleDiv.textContent = (data.title || 'Cubit Project Flow') + (totalPages > 1 ? `  ·  page ${pageIndex} of ${totalPages}` : '');
      pageDiv.appendChild(titleDiv);

      const clip = document.createElement('div');
      clip.className = 'print-clip';
      clip.style.width = tileW + 'px';
      clip.style.height = tileH + 'px';

      const stage = document.createElement('div');
      stage.style.position = 'absolute';
      stage.style.left = (-px * tileW) + 'px';
      stage.style.top = (-py * tileH) + 'px';
      stage.style.width = scaledW + 'px';
      stage.style.height = scaledH + 'px';

      data.notes.forEach(n=>{
        const d = document.createElement('div');
        d.className = 'print-note note-' + n.color;
        d.style.left = ((n.x - minX) * scaleX) + 'px';
        d.style.top = ((n.y - minY) * scaleY) + 'px';
        d.style.width = (n.w * noteScale * scaleX) + 'px';
        d.style.height = (n.h * noteScale * scaleY) + 'px';
        const fontPx = Math.max(7, 13.5 * noteScale * fontScale);
        const t = document.createElement('div');
        t.className = 'print-note-text';
        t.style.fontSize = fontPx + 'px';
        t.style.padding = Math.max(3, 6*fontScale) + 'px ' + Math.max(4, 9*fontScale) + 'px';
        t.textContent = n.text || '';
        d.appendChild(t);
        stage.appendChild(d);
      });

      clip.appendChild(stage);
      pageDiv.appendChild(clip);
      printEl.appendChild(pageDiv);
    }
  }
}

window.addEventListener('afterprint', ()=>{
  document.getElementById('printCanvas').innerHTML = '';
});

loadData();
</script>
