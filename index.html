<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cubit Project Flow</title>
<style>
  :root{
    --cream:#f4f1ea;
    --ink:#16213f;
    --line:#d8d3c6;
    --panel:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background:var(--cream);
    color:var(--ink);
    overflow:hidden;
    height:100vh;
  }

  /* ---------- HEADER ---------- */
  #app{display:flex;flex-direction:column;height:100vh;}

  header{
    padding:22px 32px 14px 32px;
    background:var(--cream);
    flex-shrink:0;
  }
  h1{
    font-family:Georgia, 'Times New Roman', serif;
    font-weight:900;
    font-style:italic;
    font-size:46px;
    margin:0 0 16px 0;
    color:var(--ink);
    outline:none;
    cursor:text;
    letter-spacing:0.5px;
  }
  h1:focus{background:#ffffff55;border-radius:6px;}

  .toolbar{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:10px;
  }
  .toolbar-group{
    display:flex;
    align-items:center;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    font-size:13px;
  }
  .toolbar-group button{
    background:none;border:none;
    padding:10px 12px;
    cursor:pointer;
    font-size:15px;
    color:var(--ink);
    border-right:1px solid var(--line);
  }
  .toolbar-group button:last-child{border-right:none;}
  .toolbar-group button:hover{background:#f0ede4;}
  .toolbar-group .label{
    padding:0 10px;
    font-family:'Courier New', monospace;
    font-size:12px;
    letter-spacing:0.5px;
    color:#7a7568;
    white-space:nowrap;
  }
  .toolbar-group .value{
    padding:0 10px;
    min-width:34px;
    text-align:center;
    font-variant-numeric:tabular-nums;
    border-right:1px solid var(--line);
    border-left:1px solid var(--line);
  }
  .btn{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 16px;
    font-size:13px;
    cursor:pointer;
    color:var(--ink);
    font-weight:600;
  }
  .btn:hover{background:#f0ede4;}
  .btn-primary{
    background:#c1571f;
    color:#fff;
    border-color:#c1571f;
  }
  .btn-primary:hover{background:#a8481a;}

  #daysInput{
    width:56px;
    border:none;
    text-align:center;
    font-size:13px;
    padding:10px 4px;
    font-family:inherit;
    color:var(--ink);
    background:var(--panel);
  }
  #daysInput:focus{outline:none; background:#f0ede4;}

  /* ---------- CANVAS VIEWPORT ---------- */
  #viewport{
    flex:1;
    overflow:auto;
    position:relative;
    border-top:1px solid var(--line);
    background:
      radial-gradient(circle, #cfc9b8 1px, transparent 1px) 0 0 / 22px 22px,
      var(--cream);
  }
  #canvas{
    position:relative;
    transform-origin:0 0;
    background:transparent;
  }
  .page-guide{
    position:absolute;
    border:1px dashed #b9a98f;
    pointer-events:none;
  }
  .page-tag{
    position:absolute;
    font-family:'Courier New', monospace;
    font-size:11px;
    color:#a99a7d;
    pointer-events:none;
  }
  .day-resize-handle{
    position:absolute;
    cursor:col-resize;
    touch-action:none;
    z-index:410;
    background:transparent;
  }
  .day-resize-handle:hover{
    background:rgba(45,110,55,0.20);
  }

  /* ---------- BLOCK ---------- */
  .block{
    position:absolute;
    border-radius:2px;
    border-left:8px solid;
    box-shadow:0 2px 6px rgba(0,0,0,0.10);
    padding:10px 30px 10px 16px;
    cursor:grab;
    touch-action:none;
    transform-origin: 0 0;
    display:flex;
    flex-direction:column;
  }
  .block.dragging{cursor:grabbing; box-shadow:0 10px 24px rgba(0,0,0,0.25); z-index:500; opacity:0.96;}
  .block.resizing{z-index:500; box-shadow:0 10px 24px rgba(0,0,0,0.25);}
  .block.selected{outline:2px solid #2f5fa8; outline-offset:2px;}

  .block-top{
    position:absolute;
    top:6px; left:8px; right:8px;
    display:flex; justify-content:flex-end; align-items:flex-start;
    pointer-events:none;
  }
  .block-top > *{pointer-events:auto;}
  .del-btn{
    width:20px;height:20px;
    border-radius:50%;
    background:rgba(0,0,0,0.08);
    border:none;
    color:#333;
    font-size:12px;
    line-height:1;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    touch-action:none;
  }
  .del-btn:hover{background:rgba(0,0,0,0.18);}

  .block-text{
    margin-top:2px;
    outline:none;
    white-space:pre-wrap;
    word-break:break-word;
    overflow-y:auto;
    overflow-x:hidden;
    flex:1;
    cursor:text;
    touch-action:manipulation;
  }
  .block-text:empty:before{
    content:'Click to type…';
    color:rgba(0,0,0,0.35);
    pointer-events:none;
  }
  .block-text ul{margin:0; padding-left:20px;}
  .block-text li{margin:2px 0;}

  /* larger, easier-to-grab resize target: visually small glyph, generous hit area */
  .resize-handle{
    position:absolute;
    right:-8px; bottom:-8px;
    width:32px;height:32px;
    cursor:nwse-resize;
    touch-action:none;
    z-index:10;
  }
  .resize-handle::after{
    content:'';
    position:absolute;
    right:9px; bottom:9px;
    width:14px;height:14px;
    background:
      linear-gradient(135deg, transparent 42%, rgba(0,0,0,0.4) 42%, rgba(0,0,0,0.4) 52%, transparent 52%),
      linear-gradient(135deg, transparent 64%, rgba(0,0,0,0.4) 64%, rgba(0,0,0,0.4) 74%, transparent 74%);
  }

  /* ---------- MINI TOOLBAR (per-block controls) ---------- */
  .mini-toolbar{
    position:absolute;
    display:flex;
    align-items:center;
    gap:6px;
    background:#1f2536;
    padding:6px 8px;
    border-radius:8px;
    box-shadow:0 4px 14px rgba(0,0,0,0.3);
    z-index:600;
    white-space:nowrap;
  }
  .mini-toolbar .group-label{
    font-size:9px;
    color:#8b93ad;
    text-transform:uppercase;
    letter-spacing:0.5px;
    margin-right:2px;
  }
  .mini-toolbar .swatch{
    width:18px;height:18px;
    border-radius:50%;
    cursor:pointer;
    border:2px solid transparent;
  }
  .mini-toolbar .swatch.active{border-color:#fff;}
  .mini-toolbar select{
    font-size:12px;
    padding:3px 4px;
    border-radius:4px;
    border:none;
  }
  .mini-toolbar button.style-btn{
    min-width:26px;height:26px;
    border-radius:4px;
    border:none;
    background:#333c54;
    color:#fff;
    cursor:pointer;
    font-size:13px;
    padding:0 6px;
  }
  .mini-toolbar button.style-btn:hover{background:#454f70;}
  .mini-toolbar input[type=color]{
    width:26px;height:26px;
    border:none;
    border-radius:4px;
    padding:0;
    background:none;
    cursor:pointer;
  }
  .mini-toolbar .divider{width:1px;height:20px;background:#3c4560;}

  /* ---------- PRINT ---------- */
  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block; position:absolute; left:0; top:0; margin:0; padding:0;}
    .print-page{
      position:relative;
      overflow:hidden;
      page-break-after:always;
      background:#f4f1ea;
    }
    .print-page:last-child{page-break-after:auto;}
    .print-block{
      position:absolute;
      border-left-width:8px;
      border-left-style:solid;
      border-radius:2px;
      padding:10px 16px;
      box-shadow:none;
    }
    .print-block ul{margin:0;padding-left:20px;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title" contenteditable="true" spellcheck="false">Cubit Project Flow</h1>
    <div class="toolbar">
      <div class="toolbar-group">
        <button id="undoBtn" title="Undo">&#8630;</button>
        <button id="redoBtn" title="Redo">&#8631;</button>
      </div>
      <div class="toolbar-group">
        <span class="label">PAGE</span>
        <button data-page-zoom="-1">&minus;</button>
        <span class="value" id="pageZoomVal">100%</span>
        <button data-page-zoom="1">+</button>
        <button id="pageZoomReset">Reset</button>
      </div>
      <div class="toolbar-group">
        <span class="label">BLOCKS</span>
        <button data-block-zoom="-1">&minus;</button>
        <span class="value" id="blockZoomVal">100%</span>
        <button data-block-zoom="1">+</button>
        <button id="blockZoomReset">Reset</button>
      </div>
      <button class="btn" id="addNoteBtn">+ add note</button>
      <button class="btn" id="clearBtn">Clear board</button>
      <button class="btn btn-primary" id="exportBtn">Export PDF</button>
    </div>
    <div class="toolbar">
      <div class="toolbar-group">
        <span class="label">PAGES ACROSS</span>
        <button data-pages-across="-1">&minus;</button>
        <span class="value" id="pagesAcrossVal">1</span>
        <button data-pages-across="1">+</button>
      </div>
      <div class="toolbar-group">
        <span class="label">PAGES DOWN</span>
        <button data-pages-down="-1">&minus;</button>
        <span class="value" id="pagesDownVal">1</span>
        <button data-pages-down="1">+</button>
      </div>
      <div class="toolbar-group">
        <span class="label">DAYS</span>
        <input type="number" id="daysInput" value="45" min="1" max="365" step="1">
        <button id="resetDayWidthsBtn" title="Make all days the same width again">Even widths</button>
      </div>
      <span style="font-size:12px;color:#8a8571;">Click a note to select it &middot; drag its background to move &middot; drag the bottom-right corner to resize &middot; select text to bold/italic/bullet/color/resize it &middot; drag the edge of any day column to widen or narrow it</span>
    </div>
  </header>

  <div id="viewport">
    <div id="canvas"></div>
  </div>
</div>

<div id="printArea"></div>

<script>
(function(){
  "use strict";

  // ---- constants ----
  var PAGE_W = 1632; // 17in @ 96dpi (tabloid landscape width)
  var PAGE_H = 1056; // 11in @ 96dpi
  var MIN_W = 140, MIN_H = 56;
  var DRAG_THRESHOLD = 4; // px of pointer movement before a click becomes a drag
  var TIMELINE_H = 44; // px height of the day ruler bar

  var PALETTE = [
    {name:'blue',   accent:'#2f5fa8', bg:'#dce9f7'},
    {name:'gold',   accent:'#c9971f', bg:'#faf1d6'},
    {name:'orange', accent:'#c1571f', bg:'#fbe3d2'},
    {name:'olive',  accent:'#5a7d2a', bg:'#e6efd4'},
    {name:'teal',   accent:'#2f8f6f', bg:'#dcf1e8'},
    {name:'purple', accent:'#6a3fa0', bg:'#e7ddf4'}
  ];

  var FONTS = [
    {label:'Sans', value:"'Segoe UI', system-ui, sans-serif"},
    {label:'Serif', value:"Georgia, 'Times New Roman', serif"},
    {label:'Mono', value:"'Courier New', monospace"},
    {label:'Condensed', value:"'Arial Narrow', Arial, sans-serif"}
  ];

  var TEXT_COLORS = ['#22283a', '#ffffff', '#c1571f', '#2f5fa8', '#5a7d2a', '#6a3fa0'];

  // ---- state ----
  var state = {
    title: 'Cubit Project Flow',
    pageZoom: 100,
    blockZoom: 100,
    pagesAcross: 1,
    pagesDown: 1,
    days: 45,
    dayWidths: [],
    nextColor: 0,
    blocks: []
  };

  function uid(){ return 'b' + Math.random().toString(36).slice(2,9); }

  function defaultBlocks(){
    return [
      mkBlock(40, 60, 480, 100, "", 0),
      mkBlock(280, 190, 220, 84, "", 1)
    ];
  }

  function mkBlock(x,y,w,h,html,colorIdx){
    return {
      id: uid(), x:x, y:y, w:w, h:h, html:html,
      color: colorIdx % PALETTE.length,
      font: FONTS[0].value,
      size: 17,
      textColor: '#22283a'
    };
  }

  // ---- persistence (best effort; degrades quietly if storage is unavailable) ----
  var STORAGE_KEY = 'cubit-project-flow-v2';
  function save(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){ /* storage unavailable in this context - continue in-memory only */ }
  }
  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && Array.isArray(parsed.blocks)){
          Object.assign(state, parsed);
          return true;
        }
      }
    }catch(e){ /* ignore */ }
    return false;
  }

  // ---- undo / redo ----
  var history = [], future = [];
  function snapshot(){ return JSON.stringify(state); }
  function pushHistory(){
    history.push(snapshot());
    if(history.length > 60) history.shift();
    future.length = 0;
  }
  function undo(){
    if(!history.length) return;
    future.push(snapshot());
    var prev = history.pop();
    Object.assign(state, JSON.parse(prev));
    render();
  }
  function redo(){
    if(!future.length) return;
    history.push(snapshot());
    var next = future.pop();
    Object.assign(state, JSON.parse(next));
    render();
  }

  // ---- DOM refs ----
  var canvas = document.getElementById('canvas');
  var viewport = document.getElementById('viewport');
  var titleEl = document.getElementById('title');

  titleEl.addEventListener('blur', function(){
    var newTitle = titleEl.textContent.trim() || 'Cubit Project Flow';
    if(newTitle !== state.title){
      pushHistory();
      state.title = newTitle;
      save();
    }
  });

  // ---- selection / mini toolbar ----
  var selectedId = null;
  var miniToolbarEl = null;

  function closeMiniToolbar(){
    if(miniToolbarEl){ miniToolbarEl.remove(); miniToolbarEl = null; }
    selectedId = null;
    document.querySelectorAll('.block.selected').forEach(function(b){ b.classList.remove('selected'); });
  }

  // helper: keep the contentEditable selection alive when clicking toolbar controls
  function preserveSelection(el){
    el.addEventListener('mousedown', function(e){ e.preventDefault(); });
  }

  // helper: manually place the caret at a screen point. Needed because
  // touch-action:none (used for smooth dragging) can suppress the browser's
  // own tap-to-place-caret behavior on some mobile browsers.
  function placeCaretAtPoint(x, y, el){
    var range;
    try{
      if(document.caretRangeFromPoint){
        range = document.caretRangeFromPoint(x, y);
      }else if(document.caretPositionFromPoint){
        var pos = document.caretPositionFromPoint(x, y);
        if(pos){
          range = document.createRange();
          range.setStart(pos.offsetNode, pos.offset);
          range.collapse(true);
        }
      }
      if(range && el.contains(range.startContainer)){
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }
    }catch(e){ /* fall back to default caret placement */ }
  }

  // helper: snapshot the current highlighted text (if any) within a given
  // editable element, so it can be restored after focus moves to a toolbar
  // control like a <select>.
  function getActiveRangeWithin(txt){
    var sel = window.getSelection();
    if(sel && sel.rangeCount > 0 && !sel.isCollapsed){
      var r = sel.getRangeAt(0);
      if(txt.contains(r.commonAncestorContainer) || r.commonAncestorContainer === txt){
        return r.cloneRange();
      }
    }
    return null;
  }
  function restoreRange(range){
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
  // helper: wrap the current selection in a <span> carrying the given inline
  // styles (used for per-word font size, since execCommand has no modern
  // equivalent for arbitrary pixel sizes).
  function applyStyleToSelection(txt, styleObj){
    var sel = window.getSelection();
    if(!sel || sel.rangeCount === 0 || sel.isCollapsed) return false;
    var range = sel.getRangeAt(0);
    if(!(txt.contains(range.commonAncestorContainer) || range.commonAncestorContainer === txt)) return false;
    var span = document.createElement('span');
    Object.keys(styleObj).forEach(function(k){ span.style[k] = styleObj[k]; });
    try{
      range.surroundContents(span);
    }catch(e){
      var frag = range.extractContents();
      span.appendChild(frag);
      range.insertNode(span);
    }
    var newRange = document.createRange();
    newRange.selectNodeContents(span);
    sel.removeAllRanges();
    sel.addRange(newRange);
    return true;
  }

  function openMiniToolbar(block, el, txt){
    if(miniToolbarEl) miniToolbarEl.remove();
    selectedId = block.id;
    document.querySelectorAll('.block.selected').forEach(function(b){ b.classList.remove('selected'); });
    el.classList.add('selected');

    var bar = document.createElement('div');
    bar.className = 'mini-toolbar';

    var lbl1 = document.createElement('span');
    lbl1.className = 'group-label'; lbl1.textContent = 'Box';
    bar.appendChild(lbl1);

    // box (background/accent) color swatches
    PALETTE.forEach(function(p, idx){
      var sw = document.createElement('div');
      sw.className = 'swatch' + (idx === block.color ? ' active' : '');
      sw.style.background = p.accent;
      sw.title = p.name;
      preserveSelection(sw);
      sw.addEventListener('click', function(e){
        e.stopPropagation();
        pushHistory();
        block.color = idx;
        save(); render();
      });
      bar.appendChild(sw);
    });

    var div1 = document.createElement('div'); div1.className='divider'; bar.appendChild(div1);

    var lbl2 = document.createElement('span');
    lbl2.className = 'group-label'; lbl2.textContent = 'Text';
    bar.appendChild(lbl2);

    // bold / italic / bullet — apply to current text selection. No full
    // re-render here: rebuilding the note's DOM would wipe out the live
    // selection, forcing you to re-select before every single format.
    var boldBtn = document.createElement('button');
    boldBtn.className = 'style-btn'; boldBtn.innerHTML = '<b>B</b>'; boldBtn.title = 'Bold selected text';
    preserveSelection(boldBtn);
    boldBtn.addEventListener('click', function(e){
      e.stopPropagation();
      txt.focus();
      document.execCommand('bold');
      block.html = txt.innerHTML; save();
    });
    bar.appendChild(boldBtn);

    var italBtn = document.createElement('button');
    italBtn.className = 'style-btn'; italBtn.innerHTML = '<i>I</i>'; italBtn.title = 'Italicize selected text';
    preserveSelection(italBtn);
    italBtn.addEventListener('click', function(e){
      e.stopPropagation();
      txt.focus();
      document.execCommand('italic');
      block.html = txt.innerHTML; save();
    });
    bar.appendChild(italBtn);

    var bulletBtn = document.createElement('button');
    bulletBtn.className = 'style-btn'; bulletBtn.innerHTML = '&#8226; List'; bulletBtn.title = 'Toggle bullet list';
    preserveSelection(bulletBtn);
    bulletBtn.addEventListener('click', function(e){
      e.stopPropagation();
      txt.focus();
      document.execCommand('insertUnorderedList');
      block.html = txt.innerHTML; save();
    });
    bar.appendChild(bulletBtn);

    // text color: quick swatches + custom picker — same rule, no re-render
    // on the selection path so you can keep formatting the same selection
    TEXT_COLORS.forEach(function(c){
      var sw = document.createElement('div');
      sw.className = 'swatch';
      sw.style.background = c;
      sw.style.border = (c === '#ffffff') ? '2px solid #666' : '2px solid transparent';
      sw.title = 'Text color';
      preserveSelection(sw);
      sw.addEventListener('click', function(e){
        e.stopPropagation();
        txt.focus();
        var sel = window.getSelection();
        if(sel && !sel.isCollapsed && txt.contains(sel.anchorNode)){
          document.execCommand('foreColor', false, c);
          block.html = txt.innerHTML;
          save();
        }else{
          pushHistory();
          block.textColor = c;
          txt.style.color = c;
          save();
        }
      });
      bar.appendChild(sw);
    });
    var customColor = document.createElement('input');
    customColor.type = 'color';
    customColor.value = block.textColor;
    customColor.title = 'Custom text color';
    preserveSelection(customColor);
    customColor.addEventListener('input', function(){
      txt.focus();
      var sel = window.getSelection();
      if(sel && !sel.isCollapsed && txt.contains(sel.anchorNode)){
        document.execCommand('foreColor', false, customColor.value);
        block.html = txt.innerHTML;
      }else{
        block.textColor = customColor.value;
        txt.style.color = customColor.value;
      }
      save();
    });
    bar.appendChild(customColor);

    var div2 = document.createElement('div'); div2.className='divider'; bar.appendChild(div2);

    // font family — applies to the selected words if any are highlighted,
    // otherwise sets the whole note's default font
    var fontSel = document.createElement('select');
    fontSel.title = 'Select text first to change just that font, or leave nothing selected to set the note\'s default';
    FONTS.forEach(function(f){
      var opt = document.createElement('option');
      opt.value = f.value; opt.textContent = f.label;
      if(f.value === block.font) opt.selected = true;
      fontSel.appendChild(opt);
    });
    var savedFontRange = null;
    fontSel.addEventListener('mousedown', function(){ savedFontRange = getActiveRangeWithin(txt); });
    fontSel.addEventListener('change', function(){
      if(savedFontRange){
        txt.focus();
        restoreRange(savedFontRange);
        document.execCommand('fontName', false, fontSel.value);
        block.html = txt.innerHTML;
        save();
      }else{
        pushHistory();
        block.font = fontSel.value;
        txt.style.fontFamily = fontSel.value;
        save();
      }
    });
    bar.appendChild(fontSel);

    // font size — applies to the selected words if any are highlighted,
    // otherwise sets the whole note's default size
    var sizeSel = document.createElement('select');
    sizeSel.title = 'Select text first to change just that size, or leave nothing selected to set the note\'s default';
    [12,13,14,15,16,17,19,21,24,28,32,38].forEach(function(s){
      var opt = document.createElement('option');
      opt.value = s; opt.textContent = s + 'px';
      if(s === block.size) opt.selected = true;
      sizeSel.appendChild(opt);
    });
    var savedSizeRange = null;
    sizeSel.addEventListener('mousedown', function(){ savedSizeRange = getActiveRangeWithin(txt); });
    sizeSel.addEventListener('change', function(){
      if(savedSizeRange){
        txt.focus();
        restoreRange(savedSizeRange);
        applyStyleToSelection(txt, {fontSize: sizeSel.value + 'px'});
        block.html = txt.innerHTML;
        save();
      }else{
        pushHistory();
        block.size = parseInt(sizeSel.value, 10);
        txt.style.fontSize = block.size + 'px';
        save();
      }
    });
    bar.appendChild(sizeSel);

    canvas.appendChild(bar);
    positionMiniToolbar(bar, block);
    miniToolbarEl = bar;
  }

  function positionMiniToolbar(bar, block){
    bar.style.left = block.x + 'px';
    bar.style.top = (block.y - 44) + 'px';
  }

  // ---- rendering ----
  var DAY_DEFAULT_W = 26; // narrower default so there's room to widen specific days
  var MIN_DAY_W = 12;

  // keeps state.dayWidths in sync with state.days, preserving any custom widths
  function getDayWidths(){
    if(!Array.isArray(state.dayWidths)) state.dayWidths = [];
    var days = Math.max(1, state.days || 1);
    while(state.dayWidths.length < days) state.dayWidths.push(DAY_DEFAULT_W);
    if(state.dayWidths.length > days) state.dayWidths.length = days;
    return state.dayWidths;
  }

  function computeDayLayout(){
    var widths = getDayWidths();
    var xs = [];
    var acc = 0;
    for(var i=0; i<widths.length; i++){ xs.push(acc); acc += widths[i]; }
    return { widths: widths, xs: xs, totalW: acc };
  }

  function applyTransform(){
    var pScale = state.pageZoom / 100;
    var layout = computeDayLayout();
    var w = Math.max(layout.totalW, state.pagesAcross * PAGE_W);
    var h = state.pagesDown * PAGE_H;
    canvas.style.transform = 'scale(' + pScale + ')';
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    viewport.style.paddingBottom = '40px';
  }

  function renderPageGuides(){
    for(var py=0; py<state.pagesDown; py++){
      for(var px=0; px<state.pagesAcross; px++){
        var g = document.createElement('div');
        g.className = 'page-guide';
        g.style.left = (px*PAGE_W) + 'px';
        g.style.top = (py*PAGE_H) + 'px';
        g.style.width = PAGE_W + 'px';
        g.style.height = PAGE_H + 'px';
        canvas.appendChild(g);

        var tag = document.createElement('div');
        tag.className = 'page-tag';
        tag.textContent = 'PAGE ' + (py*state.pagesAcross+px+1) + ' \u2022 TABLOID 17\u00d711';
        tag.style.left = (px*PAGE_W + 8) + 'px';
        tag.style.top = (py*PAGE_H + 6) + 'px';
        canvas.appendChild(tag);
      }
    }
  }

  function getScale(){
    return (state.pageZoom/100) * (state.blockZoom/100);
  }

  // Builds the day ruler (top bar with numbered day columns), full-height
  // vertical gridlines/bands at every day boundary, and — on the live canvas
  // only — a draggable handle on each day's right edge so you can widen or
  // narrow any single day. Shared by the live canvas and the tiled PDF
  // export so both stay in sync; the export just skips the drag handles.
  function addTimeline(container, totalH, forPrint){
    var layout = computeDayLayout();
    var widths = layout.widths, xs = layout.xs, totalW = layout.totalW;
    var days = widths.length;

    // alternating light-green bands behind each day column, full page height
    for(var k=0; k<days; k++){
      var band = document.createElement('div');
      band.style.position = 'absolute';
      band.style.left = xs[k] + 'px';
      band.style.top = '0';
      band.style.width = widths[k] + 'px';
      band.style.height = totalH + 'px';
      band.style.background = (k % 2 === 0) ? 'rgba(90,160,90,0.14)' : 'rgba(90,160,90,0.06)';
      band.style.pointerEvents = 'none';
      if(!forPrint) band.className = 'day-band';
      container.appendChild(band);
    }

    // full-height gridlines at every boundary, so the ruler bar paints over their tops
    for(var j=0; j<=days; j++){
      var lineX = (j < days) ? xs[j] : totalW;
      var line = document.createElement('div');
      line.style.position = 'absolute';
      line.style.left = lineX + 'px';
      line.style.top = '0';
      line.style.width = '1px';
      line.style.height = totalH + 'px';
      var heavy = (j % 7 === 0);
      line.style.background = heavy ? 'rgba(45,110,55,0.45)' : 'rgba(90,160,90,0.30)';
      line.style.pointerEvents = 'none';
      if(!forPrint) line.className = 'day-gridline';
      container.appendChild(line);
    }

    var ruler = document.createElement('div');
    ruler.style.position = 'absolute';
    ruler.style.left = '0';
    ruler.style.top = '0';
    ruler.style.width = totalW + 'px';
    ruler.style.height = TIMELINE_H + 'px';
    ruler.style.background = forPrint ? '#f4f1ea' : 'rgba(244,241,234,0.96)';
    ruler.style.borderBottom = '2px solid #16213f';
    ruler.style.pointerEvents = 'none';
    ruler.style.zIndex = '400';
    if(!forPrint) ruler.className = 'day-ruler';
    container.appendChild(ruler);

    for(var i=0; i<days; i++){
      var cell = document.createElement('div');
      cell.style.position = 'absolute';
      cell.style.left = xs[i] + 'px';
      cell.style.top = '0';
      cell.style.width = widths[i] + 'px';
      cell.style.height = TIMELINE_H + 'px';
      cell.style.borderRight = '1px solid #d8d3c6';
      cell.style.display = 'flex';
      cell.style.alignItems = 'center';
      cell.style.justifyContent = 'center';
      cell.style.overflow = 'hidden';
      cell.style.fontFamily = "'Courier New', monospace";
      cell.style.fontSize = '11px';
      cell.style.color = '#6b6656';
      cell.style.fontWeight = ((i+1) % 7 === 1 || days <= 14) ? '700' : '400';
      cell.textContent = i+1;
      ruler.appendChild(cell);
    }

    // draggable day-width handles — live canvas only
    if(!forPrint){
      for(var d=0; d<days; d++){
        (function(dayIdx){
          var edgeX = xs[dayIdx] + widths[dayIdx];
          var grip = document.createElement('div');
          grip.className = 'day-resize-handle';
          grip.style.left = (edgeX - 5) + 'px';
          grip.style.top = '0';
          grip.style.width = '10px';
          grip.style.height = totalH + 'px';
          grip.title = 'Drag to widen or narrow day ' + (dayIdx+1);
          grip.addEventListener('pointerdown', function(e){
            e.preventDefault();
            e.stopPropagation();
            try{ grip.setPointerCapture(e.pointerId); }catch(err){}
            var startX = e.clientX;
            var origW = widths[dayIdx];
            var scale = getScale();
            var rafId = null;
            function apply(){
              rafId = null;
              renderTimelineOnly();
            }
            function onMove(ev){
              var dx = (ev.clientX - startX) / scale;
              state.dayWidths[dayIdx] = Math.max(MIN_DAY_W, origW + dx);
              if(rafId === null) rafId = requestAnimationFrame(apply);
            }
            function onUp(){
              document.removeEventListener('pointermove', onMove);
              document.removeEventListener('pointerup', onUp);
              if(rafId !== null){ cancelAnimationFrame(rafId); apply(); }
              save();
            }
            pushHistory();
            document.addEventListener('pointermove', onMove);
            document.addEventListener('pointerup', onUp);
          });
          container.appendChild(grip);
        })(d);
      }
    }
  }

  // Redraws just the day-ruler/gridline layer (fast) without touching the
  // blocks or page guides, so dragging a day's width feels smooth.
  function renderTimelineOnly(){
    document.querySelectorAll('.day-band, .day-gridline, .day-ruler, .day-resize-handle').forEach(function(n){ n.remove(); });
    applyTransform();
    addTimeline(canvas, state.pagesDown*PAGE_H, false);
  }

  function render(){
    titleEl.textContent = state.title;
    document.getElementById('pageZoomVal').textContent = state.pageZoom + '%';
    document.getElementById('blockZoomVal').textContent = state.blockZoom + '%';
    document.getElementById('pagesAcrossVal').textContent = state.pagesAcross;
    document.getElementById('pagesDownVal').textContent = state.pagesDown;
    document.getElementById('daysInput').value = state.days;

    canvas.innerHTML = '';
    miniToolbarEl = null;
    applyTransform();
    renderPageGuides();
    addTimeline(canvas, state.pagesDown*PAGE_H, false);

    var bScale = state.blockZoom / 100;

    state.blocks.forEach(function(block){
      var pal = PALETTE[block.color];
      var el = document.createElement('div');
      el.className = 'block';
      el.dataset.id = block.id;
      el.style.left = block.x + 'px';
      el.style.top = block.y + 'px';
      el.style.width = block.w + 'px';
      el.style.height = block.h + 'px';
      el.style.background = pal.bg;
      el.style.borderLeftColor = pal.accent;
      el.style.transform = 'scale(' + bScale + ')';

      var top = document.createElement('div');
      top.className = 'block-top';

      var del = document.createElement('button');
      del.className = 'del-btn';
      del.textContent = '\u00d7';
      del.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
      del.addEventListener('click', function(e){
        e.stopPropagation();
        pushHistory();
        state.blocks = state.blocks.filter(function(b){ return b.id !== block.id; });
        closeMiniToolbar();
        save(); render();
      });
      top.appendChild(del);

      el.appendChild(top);

      var txt = document.createElement('div');
      txt.className = 'block-text';
      txt.contentEditable = 'true';
      txt.spellcheck = false;
      txt.innerHTML = block.html;
      txt.style.fontFamily = block.font;
      txt.style.fontSize = block.size + 'px';
      txt.style.color = block.textColor;

      txt.addEventListener('blur', function(){
        var newHtml = txt.innerHTML;
        if(newHtml !== block.html){
          pushHistory();
          block.html = newHtml;
          save();
        }
      });

      // Force Enter to always insert a simple, flat <br> line break rather
      // than the browser's default (which can nest a new <div> per line and
      // behave inconsistently across browsers) — this keeps every line you
      // create permanent and in order, no matter how the note is resized.
      txt.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){
          e.preventDefault();
          document.execCommand('insertLineBreak');
        }
      });

      // click (no movement) = edit text; drag (movement past threshold) = move the block
      // Let the browser handle clicks and click-drag text selection on its
      // own — nothing intercepted here, so selecting a word or phrase works
      // exactly like it would in any text field. We just make sure the mini
      // toolbar opens afterward, and give mobile taps an explicit focus
      // nudge since touch-action:none on the note can otherwise suppress it.
      txt.addEventListener('pointerup', function(e){
        var sel = window.getSelection();
        var hasSelection = sel && !sel.isCollapsed &&
          (txt.contains(sel.anchorNode) || sel.anchorNode === txt);
        if(!hasSelection){
          txt.focus();
          if(e.pointerType === 'touch' || e.pointerType === 'pen'){
            placeCaretAtPoint(e.clientX, e.clientY, txt);
          }
        }
        openMiniToolbar(block, el, txt);
      });

      el.appendChild(txt);

      var handle = document.createElement('div');
      handle.className = 'resize-handle';
      handle.addEventListener('pointerdown', function(e){
        e.preventDefault();
        e.stopPropagation();
        try{ handle.setPointerCapture(e.pointerId); }catch(err){}
        var startX = e.clientX, startY = e.clientY;
        var origW = block.w, origH = block.h;
        var scale = getScale();
        var moved = false;
        var rafId = null, pendingW = block.w, pendingH = block.h;
        pushHistory();
        el.classList.add('resizing');

        function apply(){
          rafId = null;
          el.style.width = pendingW + 'px';
          el.style.height = pendingH + 'px';
          if(miniToolbarEl && selectedId === block.id) positionMiniToolbar(miniToolbarEl, block);
        }
        function onMove(ev){
          var dw = (ev.clientX - startX) / scale;
          var dh = (ev.clientY - startY) / scale;
          if(Math.abs(dw) > 1 || Math.abs(dh) > 1) moved = true;
          block.w = Math.max(MIN_W, origW + dw);
          block.h = Math.max(MIN_H, origH + dh);
          pendingW = block.w; pendingH = block.h;
          if(rafId === null) rafId = requestAnimationFrame(apply);
        }
        function onUp(ev){
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
          if(rafId !== null){ cancelAnimationFrame(rafId); apply(); }
          el.classList.remove('resizing');
          if(!moved){ history.pop(); }
          save();
        }
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
      });
      el.appendChild(handle);

      // dragging from the block's background/padding (not text, not handle, not dot/del)
      el.addEventListener('pointerdown', function(e){
        if(e.target !== el) return; // only the bare background, children handle themselves
        var startX = e.clientX, startY = e.clientY;
        var origX = block.x, origY = block.y;
        var scale = getScale();
        var dragging = false;
        var rafId = null, pendingX = block.x, pendingY = block.y;

        function apply(){
          rafId = null;
          el.style.left = pendingX + 'px';
          el.style.top = pendingY + 'px';
          if(miniToolbarEl && selectedId === block.id) positionMiniToolbar(miniToolbarEl, block);
        }
        function onMove(ev){
          var dx = ev.clientX - startX, dy = ev.clientY - startY;
          if(!dragging && (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD)){
            dragging = true;
            pushHistory();
            el.classList.add('dragging');
          }
          if(dragging){
            block.x = Math.max(0, origX + dx/scale);
            block.y = Math.max(0, origY + dy/scale);
            pendingX = block.x; pendingY = block.y;
            if(rafId === null) rafId = requestAnimationFrame(apply);
          }
        }
        function onUp(){
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
          if(rafId !== null){ cancelAnimationFrame(rafId); apply(); }
          if(dragging){
            el.classList.remove('dragging');
            save();
          }else{
            openMiniToolbar(block, el, txt);
          }
        }
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
      });

      canvas.appendChild(el);

      if(selectedId === block.id){
        openMiniToolbar(block, el, txt);
      }
    });
  }

  // click on empty canvas closes toolbar
  viewport.addEventListener('pointerdown', function(e){
    if(e.target === viewport || e.target === canvas){
      closeMiniToolbar();
    }
  });

  // ---- toolbar wiring ----
  document.getElementById('undoBtn').addEventListener('click', undo);
  document.getElementById('redoBtn').addEventListener('click', redo);

  document.querySelectorAll('[data-page-zoom]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var d = parseInt(btn.dataset.pageZoom, 10);
      state.pageZoom = Math.min(200, Math.max(20, state.pageZoom + d*5));
      save(); render();
    });
  });
  document.getElementById('pageZoomReset').addEventListener('click', function(){
    state.pageZoom = 100; save(); render();
  });

  document.querySelectorAll('[data-block-zoom]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var d = parseInt(btn.dataset.blockZoom, 10);
      state.blockZoom = Math.min(200, Math.max(40, state.blockZoom + d*5));
      save(); render();
    });
  });
  document.getElementById('blockZoomReset').addEventListener('click', function(){
    state.blockZoom = 100; save(); render();
  });

  document.querySelectorAll('[data-pages-across]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var d = parseInt(btn.dataset.pagesAcross, 10);
      state.pagesAcross = Math.min(6, Math.max(1, state.pagesAcross + d));
      save(); render();
    });
  });
  document.querySelectorAll('[data-pages-down]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var d = parseInt(btn.dataset.pagesDown, 10);
      state.pagesDown = Math.min(6, Math.max(1, state.pagesDown + d));
      save(); render();
    });
  });

  document.getElementById('daysInput').addEventListener('change', function(){
    var v = Math.min(365, Math.max(1, parseInt(this.value, 10) || 1));
    pushHistory();
    state.days = v;
    save(); render();
  });

  document.getElementById('resetDayWidthsBtn').addEventListener('click', function(){
    pushHistory();
    state.dayWidths = new Array(Math.max(1, state.days||1)).fill(DAY_DEFAULT_W);
    save(); render();
  });

  document.getElementById('addNoteBtn').addEventListener('click', function(){
    pushHistory();
    var idx = state.nextColor % PALETTE.length;
    state.nextColor++;
    var n = state.blocks.length;
    var x = 60 + (n % 6) * 46;
    var y = 60 + (n % 6) * 46;
    state.blocks.push(mkBlock(x, y, 240, 90, '', idx));
    save(); render();
  });

  document.getElementById('clearBtn').addEventListener('click', function(){
    if(!confirm('Clear the board? This removes all notes.')) return;
    pushHistory();
    state.blocks = [];
    closeMiniToolbar();
    save(); render();
  });

  // ---- PDF export: tile the canvas into real tabloid (17x11in) print pages ----
  function buildPrintPages(){
    var printArea = document.getElementById('printArea');
    printArea.innerHTML = '';

    var styleTag = document.getElementById('dynamicPageSize');
    if(!styleTag){
      styleTag = document.createElement('style');
      styleTag.id = 'dynamicPageSize';
      document.head.appendChild(styleTag);
    }
    styleTag.textContent = '@page{ size: 17in 11in; margin:0; }';

    var layout = computeDayLayout();
    var totalW = Math.max(layout.totalW, state.pagesAcross*PAGE_W);
    var effPagesAcross = Math.max(state.pagesAcross, Math.ceil(layout.totalW / PAGE_W));

    for(var py=0; py<state.pagesDown; py++){
      for(var px=0; px<effPagesAcross; px++){
        var page = document.createElement('div');
        page.className = 'print-page';
        page.style.width = PAGE_W + 'px';
        page.style.height = PAGE_H + 'px';

        var inner = document.createElement('div');
        inner.style.position = 'absolute';
        inner.style.left = (-px*PAGE_W) + 'px';
        inner.style.top = (-py*PAGE_H) + 'px';
        inner.style.width = totalW + 'px';
        inner.style.height = (state.pagesDown*PAGE_H) + 'px';

        addTimeline(inner, state.pagesDown*PAGE_H, true);

        state.blocks.forEach(function(block){
          var pal = PALETTE[block.color];
          var b = document.createElement('div');
          b.className = 'print-block';
          b.style.left = block.x + 'px';
          b.style.top = block.y + 'px';
          b.style.width = block.w + 'px';
          b.style.height = block.h + 'px';
          b.style.background = pal.bg;
          b.style.borderLeftColor = pal.accent;

          var t = document.createElement('div');
          t.style.marginTop = '2px';
          t.style.whiteSpace = 'pre-wrap';
          t.style.wordBreak = 'break-word';
          t.style.fontFamily = block.font;
          t.style.fontSize = block.size + 'px';
          t.style.color = block.textColor;
          t.innerHTML = block.html;
          b.appendChild(t);
          inner.appendChild(b);
        });

        page.appendChild(inner);
        printArea.appendChild(page);
      }
    }
  }

  document.getElementById('exportBtn').addEventListener('click', function(){
    closeMiniToolbar();
    buildPrintPages();
    setTimeout(function(){ window.print(); }, 50);
  });

  // ---- init ----
  if(!load()){
    state.blocks = defaultBlocks();
  }
  render();

  window.addEventListener('keydown', function(e){
    var active = document.activeElement;
    var editingText = active && active.classList && active.classList.contains('block-text');
    var editingTitle = active === titleEl;
    if(editingText || editingTitle) return;
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey){ e.preventDefault(); undo(); }
    if((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase()==='z'))){ e.preventDefault(); redo(); }
  });

})();
</script>
</body>
</html>
